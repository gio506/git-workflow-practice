name: Docs CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  markdown-lint:
    name: Stage 1 - Markdown lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint markdown
        uses: DavidAnson/markdownlint-cli2-action@v18
        with:
          globs: |
            **/*.md

  check-links:
    name: Stage 2 - Check links
    runs-on: ubuntu-latest
    needs: markdown-lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          use-verbose-mode: 'no'
          config-file: '.github/link-check-config.json'
          folder-path: '.'

  validate-templates-and-spellcheck:
    name: Stage 3 - Validate templates + spellcheck
    runs-on: ubuntu-latest
    needs: check-links
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required templates exist
        run: |
          test -f .github/PULL_REQUEST_TEMPLATE.md
          test -f .github/ISSUE_TEMPLATE/bug.md
          test -f .github/ISSUE_TEMPLATE/feature.md

      - name: Basic spellcheck
        uses: codespell-project/actions-codespell@v2
        with:
          check_filenames: true
          check_hidden: false
