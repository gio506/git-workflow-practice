name: Docs CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  structure-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required files
        shell: bash
        run: |
          required_files=(
            "README.md"
            "CHEATSHEET.md"
            "FILES_EXPLAINED.md"
            ".gitignore"
            "examples/project-log.txt"
            "scripts/validate_repo.sh"
            "docs/commit-style.md"
            "docs/review-checklist.md"
            ".github/PULL_REQUEST_TEMPLATE.md"
            ".github/ISSUE_TEMPLATE/bug.md"
            ".github/ISSUE_TEMPLATE/feature.md"
          )
          for file in "${required_files[@]}"; do
            test -f "$file" || {
              echo "Missing required file: $file"
              exit 1
            }
          done

  markdown-lint:
    runs-on: ubuntu-latest
    needs: structure-check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint Markdown files
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: |
            **/*.md

  practice-flow-check:
    runs-on: ubuntu-latest
    needs: markdown-lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make validation script executable
        run: chmod +x scripts/validate_repo.sh

      - name: Validate repo learning flow
        run: bash scripts/validate_repo.sh

  final-status-gate:
    runs-on: ubuntu-latest
    if: always()
    needs:
      - structure-check
      - markdown-lint
      - practice-flow-check
    steps:
      - name: Aggregate results
        shell: bash
        env:
          STRUCTURE: ${{ needs.structure-check.result }}
          MARKDOWN: ${{ needs.markdown-lint.result }}
          PRACTICE: ${{ needs.practice-flow-check.result }}
        run: |
          for result in "$STRUCTURE" "$MARKDOWN" "$PRACTICE"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              exit 1
            fi
          done
